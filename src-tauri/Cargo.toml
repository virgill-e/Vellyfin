[package]
name = "vellyfin"
version = "0.2.0"
description = "Client Jellyfin desktop avec lecture hors ligne"
authors = ["Vellyfin contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
# Suffixe _lib : évite un conflit de nom avec le binaire sous Windows.
name = "vellyfin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
tauri = { version = "2.12.6", features = ["protocol-asset"] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "macros", "time", "rt"] }
futures-util = "0.3"
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.1"
