name: CI

# Vérifications légères à chaque push/PR touchant le code.
# Les installeurs sont produits par release.yml (tag ou déclenchement manuel).
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE", ".github/dependabot.yml"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "LICENSE", ".github/dependabot.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Interface (tests + types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck

  rust:
    name: Rust (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri-build exige que le dossier du frontend existe, même vide.
      - run: mkdir -p .output/public
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
